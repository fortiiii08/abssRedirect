<style>
  :root {
    --navy: #0f2240;
    --navy-deep: #081429;
    --gold: #d4a94f;
    --gold-light: #f6dc98;
    --cream: #f3ece0;
    --dur: 5600ms; /* tempo total até o redirecionamento */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vh, 40px);
    padding: 16px;
    background: radial-gradient(ellipse at 50% 40%, #183462 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color: var(--cream);
    font-family: "Montserrat", system-ui, sans-serif;
    overflow: hidden;
  }

  /* partículas douradas sutis */
  .dust { position: fixed; inset: 0; pointer-events: none; }
  .dust span {
    position: absolute; bottom: -10px;
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--gold-light);
    box-shadow: 0 0 8px 2px rgba(246, 220, 152, .6);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    15%  { opacity: .8; }
    100% { transform: translateY(-105vh); opacity: 0; }
  }

  /* palco com a proporção exata da imagem (1751x898) */
  .stage {
    position: relative;
    width: min(100%, 1100px, calc(70dvh * 1751 / 898));
    aspect-ratio: 1751 / 898;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(212, 169, 79, .0), 0 30px 80px rgba(0, 0, 0, .45);
    animation: frame 1s ease 2.6s forwards;
  }
  @keyframes frame {
    to { box-shadow: 0 0 0 1px rgba(212, 169, 79, .55), 0 30px 80px rgba(0, 0, 0, .45), 0 0 60px rgba(212, 169, 79, .18); }
  }

  .banner {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    clip-path: circle(0% at 17% 45%);
    animation: reveal 1.4s cubic-bezier(.65, 0, .35, 1) 2.5s forwards;
  }
  @keyframes reveal {
    0%   { opacity: 1; clip-path: circle(0% at 17% 45%); filter: brightness(1.6) saturate(.6); }
    100% { opacity: 1; clip-path: circle(150% at 17% 45%); filter: brightness(1) saturate(1); }
  }

  /* brilho que atravessa a imagem */
  .shine {
    position: absolute; inset: 0;
    pointer-events: none;
    background: linear-gradient(105deg,
      transparent 35%,
      rgba(255, 240, 200, .0) 40%,
      rgba(255, 240, 200, .55) 50%,
      rgba(255, 240, 200, .0) 60%,
      transparent 65%);
    background-size: 250% 100%;
    background-position: 150% 0;
    mix-blend-mode: soft-light;
    animation: sweep 1.6s ease-in-out 3.7s forwards;
  }
  .shine.two { mix-blend-mode: screen; opacity: .35; animation-delay: 3.75s; }
  @keyframes sweep { to { background-position: -50% 0; } }

  /* SVG desenhado por cima, mesmas coordenadas da imagem */
  .draw {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    animation: drawOut .9s ease 3.1s forwards;
  }
  @keyframes drawOut { to { opacity: 0; } }

  .draw .stroke {
    fill: transparent;
    stroke: url(#goldStroke);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: var(--len, 900);
    stroke-dashoffset: var(--len, 900);
    animation:
      trace var(--t, 1.8s) cubic-bezier(.55, .05, .35, 1) var(--d, 0s) forwards,
      fillIn .7s ease calc(var(--d, 0s) + var(--t, 1.8s) - .25s) forwards;
  }
  @keyframes trace { to { stroke-dashoffset: 0; } }
  @keyframes fillIn { to { fill: rgba(246, 220, 152, .9); } }
  .draw .line { fill: none; }
  .draw .line { animation: trace var(--t, 1s) ease var(--d, 0s) forwards; }

  .draw text { font-family: "Cinzel", Georgia, serif; font-weight: 700; }
  .draw text.sans { font-family: "Montserrat", sans-serif; font-weight: 500; }

  /* ponto de luz que "percorre" o traço */
  .spark {
    fill: #fff8e6;
    filter: url(#glowStrong);
    opacity: 0;
  }

  /* texto e progresso */
  .msg {
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    animation: up .8s ease .6s forwards;
  }
  @keyframes up { to { opacity: 1; transform: none; } }
  .msg h1 {
    font-family: "Cinzel", Georgia, serif;
    font-weight: 600;
    font-size: clamp(17px, 2.4vw, 24px);
    letter-spacing: .04em;
    color: var(--cream);
  }
  .msg h1 b { color: var(--gold-light); font-weight: 700; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }

  .bar {
    width: min(320px, 80vw);
    height: 3px;
    margin: 16px auto 14px;
    border-radius: 3px;
    background: rgba(243, 236, 224, .12);
    overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #b8862f, var(--gold-light), #b8862f);
    box-shadow: 0 0 12px rgba(246, 220, 152, .8);
    animation: load var(--dur) cubic-bezier(.4, 0, .2, 1) forwards;
  }
  @keyframes load { to { width: 100%; } }

  .msg a {
    font-size: 13px;
    color: rgba(243, 236, 224, .65);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .msg a:hover { color: var(--gold-light); }

  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 2500ms; }
    .draw { display: none; }
    .banner { animation: none; opacity: 1; clip-path: none; }
    .shine, .dust { display: none; }
  }
</style>
</head>
<body>
<noscript>

<div class="stage" role="img" aria-label="ABSS Advogados — Blanco e Salomão, Sociedade de Advogados">

  <svg class="draw" viewBox="0 0 1751 898" aria-hidden="true">

    <g filter="url(#glow)">

            d="M262 520 C 190 500, 155 440, 168 370 C 176 330, 196 305, 222 288"/>
      <path class="stroke line" style="--len:520;--d:.1s;--t:1.6s"

      <!-- monograma A S B -->

      <text class="stroke" style="--len:1000;--d:.45s;--t:1.9s" x="246" y="472" font-size="225">S</text>
      <text class="stroke" style="--len:1100;--d:.35s;--t:1.9s" x="286" y="452" font-size="205">B</text>

      <!-- filetes -->
      <path class="stroke line" style="--len:420;--d:.4s;--t:1.2s" d="M428 241 H 840"/>
      <path class="stroke line" style="--len:420;--d:1.0s;--t:1.2s" d="M428 459 H 848"/>

      <!-- nome -->
      <text class="stroke" style="--len:900;--d:.5s;--t:1.9s"
            x="423" y="380" font-size="148" textLength="428" lengthAdjust="spacingAndGlyphs">ABSS</text>
      <text class="stroke" style="--len:500;--d:.8s;--t:1.7s"
            x="425" y="440" font-size="60" textLength="426" lengthAdjust="spacingAndGlyphs">ADVOGADOS</text>
      <text class="stroke" style="--len:300;--d:1.1s;--t:1.4s"
            x="425" y="507" font-size="40" textLength="425" lengthAdjust="spacingAndGlyphs">BLANCO E SALOMÃO</text>
      <text class="stroke sans" style="--len:200;--d:1.3s;--t:1.2s;stroke-width:1.2"
            x="425" y="549" font-size="25" textLength="425" lengthAdjust="spacingAndGlyphs">SOCIEDADE DE ADVOGADOS</text>
    </g>

    <!-- faíscas que percorrem os filetes -->
    <circle class="spark" r="5">
      <animateMotion dur="1.2s" begin="0.4s" fill="freeze" path="M428 241 H 840"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.2s" begin="0.4s" fill="freeze"/>
    </circle>
    <circle class="spark" r="5">
      <animateMotion dur="1.2s" begin="1.0s" fill="freeze" path="M428 459 H 848"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.2s" begin="1.0s" fill="freeze"/>
    </circle>
    <circle class="spark" r="5">
      <animateMotion dur="1.6s" begin="0.1s" fill="freeze" path="M262 520 C 190 500, 155 440, 168 370 C 176 330, 196 305, 222 288"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="0.1s" fill="freeze"/>
    </circle>
    <circle class="spark" r="5">
      <animateMotion dur="1.6s" begin="0.1s" fill="freeze" path="M318 520 C 390 500, 425 440, 412 370 C 404 330, 384 305, 358 288"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="0.1s" fill="freeze"/>
    </circle>
  </svg>

  <div class="shine"></div>
  <div class="shine two"></div>
</div>

<div class="msg" role="status" aria-live="polite">
  <h1>Estamos te direcionando para o <b>WhatsApp</b><span class="dots"></span></h1>
  <div class="bar"><i></i></div>
  <a id="go" href="https://api.whatsapp.com/send/?phone=5511956915384&amp;text=Ol%C3%A1%21+Vim+pelo+LinkedIn+e+gostaria+de+entender+melhor+meu+caso.&amp;type=phone_number&amp;app_absent=0">Não foi redirecionado? Toque aqui</a>
</div>

<script>
  (function () {
    var url = document.getElementById('go').href;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var delay = reduce ? 2500 : 5600;

    // partículas
    var dust = document.querySelector('.dust');
    if (!reduce) {
      for (var i = 0; i < 22; i++) {
        var s = document.createElement('span');
        s.style.left = (Math.random() * 100) + 'vw';
        s.style.animationDuration = (6 + Math.random() * 7) + 's';
        s.style.animationDelay = (Math.random() * 6) + 's';
        s.style.transform = 'scale(' + (0.5 + Math.random()) + ')';
        dust.appendChild(s);
      }
    }

    // redireciona após a animação, mas espera a Insight Tag carregar (no máximo +2,5 s)
    var start = Date.now();
    function go() { window.location.replace(url); }
    function tryGo() {
      if (window.__liLoaded) return setTimeout(go, 400); // folga para o pixel ser enviado
      if (Date.now() - start > delay + 2500) return go();
      setTimeout(tryGo, 150);
    }
    setTimeout(tryGo, delay);
  })();
</script>
